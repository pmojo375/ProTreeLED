<!DOCTYPE html>
<html>

<head>
  <title>LED Christmas Tree Control</title>
  <style>
      body {
          font-family: Arial, sans-serif;
          background-color: #f4f4f4;
          padding: 20px;
          color: #333;
      }

      h1 {
          color: #4CAF50;
      }

      label {
          display: block;
          margin: 15px 0 5px;
      }

      input[type=color], input[type=range] {
          width: 100%;
          height: 50px;
          padding: 8px;
          border: 1px solid #ddd;
          border-radius: 4px;
          box-sizing: border-box;
      }

      button {
          background-color: #4CAF50;
          color: white;
          padding: 10px 20px;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          font-size: 16px;
      }

      button:hover {
          background-color: #45a049;
      }

      .control-group {
          margin-bottom: 20px;
      }
  </style>
</head>

<body>

  <h1>LED Christmas Tree Control</h1>

  <label for="mode">Select Function:</label>
  <select id="mode">
      <option value="0">Normal</option>
      <option value="1">Color Waves</option>
      <option value="2">Twinkling Stars</option>
      <option value="3">Candy Cane</option>
      <option value="4">Rising Sparkles</option>
      <option value="5">Twinkle Fox</option>
      <option value="6">Fire</option>
      <option value="7">Set Range</option>
      <option value="8">Group Test</option>
  </select>
  <button onclick="sendMode()">Apply Mode</button>

  <br><br>

  <label for="groupInput">Enter LED Group:</label>
  <input type="text" id="groupInput" placeholder="e.g., 0-50, 55, 60-65">
  <button onclick="sendGroup()">Send Group</button>

  <br><br>

  <label for="incgHueState">Enable gHue Increment:</label>
  <input type="checkbox" id="incgHueState" checked>
  <button onclick="sendIncgHueState()">Apply</button>

  <br><br>

  <label for="startRange">Start Range:</label>
  <input type="number" id="startRange" name="startRange">
  <label for="endRange">End Range:</label>
  <input type="number" id="endRange" name="endRange">
  <button onclick="sendRange()">Apply Range</button>

  <label for="audioBrightness">Audio Brightness:</label>
  <input type="checkbox" id="audioBrightness" checked>
  <button onclick="sendAudioBrightnessState()">Apply</button>

  <br><br>

  <label for="palette">Select Color Palette:</label>
  <select id="palette">
      <option value="0">RainbowColors</option>
      <option value="1">RainbowStripeColors</option>
      <option value="2">CloudColors</option>
      <option value="3">LavaColors</option>
      <option value="4">OceanColors</option>
      <option value="5">ForestColors</option>
      <option value="6">PartyColors</option>
      <option value="7">HeatColors</option>
      <option value="8">Retro</option>
      <option value="9">Blue White</option>
      <option value="10">Fairy Lifhts</option>
      <option value="11">Red Green White</option>
      <option value="12">Red White</option>
      <option value="13">Snow</option>
      <option value="14">Holly</option>
      <option value="15">Ice</option>
  </select>
  <button onclick="sendPalette()">Change Palette</button>

  <br><br>

  <label for="Color1">Color 1:</label>
  <input type="color" id="Color1" name="Color1" onchange="changeColor1(this.value)">

  <br><br>

  <label for="Color2">Color 2:</label>
  <input type="color" id="Color2" name="Color2" onchange="changeColor2(this.value)">

  <br><br>

  <label for="Color3">Color 3:</label>
  <input type="color" id="Color3" name="Color3" onchange="changeColor3(this.value)">

  <br><br>

  <label for="Color2">Color 4:</label>
  <input type="color" id="Color4" name="Color4" onchange="changeColor4(this.value)">

  <br><br>

  <label for="fps">FPS:</label>
  <input type="range" id="fps" name="fps" min="1" max="66" onchange="changeFPS(this.value)">

  <br><br>

  <label for="brightness">Brightness:</label>
  <input type="range" id="brightness" name="brightness" min="0" max="255" onchange="changeBrightness(this.value)">

  <br><br>

  <label for="fadeAmount">Fade Amount:</label>
  <input type="range" id="fadeAmount" name="fadeAmount" min="0" max="255" onchange="changeFadeAmount(this.value)">
  
  <br><br>

  <label for="twinkleSpeed">Twinkle Speed:</label>
  <input type="range" id="twinkleSpeed" name="twinkleSpeed" min="0" max="8" onchange="changeTwinkleSpeed(this.value)">

  <br><br>

  <label for="twinkleDensity">Twinkle Density:</label>
  <input type="range" id="twinkleDensity" name="twinkleDensity" min="0" max="8" onchange="changeTwinkleDensity(this.value)">

  <br><br>

  <label for="coolLikeState">Enable Cool Like Incandescent:</label>
  <input type="checkbox" id="coolLikeState" checked>
  <button onclick="sendCoolLikeState()">Apply</button>

  <br><br>

  <label for="autoBgState">Enable Auto Background Color:</label>
  <input type="checkbox" id="autoBgState" checked>
  <button onclick="sendAutoBgState()">Apply</button>

  <br><br>

  <label for="fps_variability">FPS Variability:</label>
  <input type="range" id="fps_variability" name="fps_variability" min="0" max="66" onchange="changeFPS_Variability(this.value)">

  <script>
    var socket;
    
    function initWebSocket() {
        socket = new WebSocket('ws://' + window.location.hostname + '/ws_control');
        socket.onopen = function(event) {
            console.log('WebSocket connected');
        };
        socket.onclose = function(event) {
            console.log('WebSocket disconnected');
            setTimeout(initWebSocket, 2000);
        };
        socket.onmessage = function(event) {
          console.log("Received message:", event.data);
          var message = JSON.parse(event.data);
          console.log("Parsed message:", message);
          switch(message.type) {
              case 'Mode':
                  mode = message.value;
                  document.getElementById("mode").value = mode;
                  break;
              case 'Start Range':
                  startRange = message.value;
                  document.getElementById("startRange").value = startRange;
                  break;
              case 'End Range':
                  endRange = message.value;
                  document.getElementById("endRange").value = endRange;
                  break;
              case 'Palette':
                  palette = message.value;
                  document.getElementById("palette").value = palette;
                  break;
              case 'Increment gHue':
                  gHueState = message.value;
                  if (gHueState == 1) {
                    document.getElementById("incgHueState").checked = true;
                  } else {
                    document.getElementById("incgHueState").checked = false;
                  }
                  break;
              case 'Brightness Audio':
                  audioBrightness = message.value;
                  if (audioBrightness == 1) {
                    document.getElementById("audioBrightness").checked = true;
                  } else {
                    document.getElementById("audioBrightness").checked = false;
                  }
                  break;
              case 'Color 1':
                  color1 = message.value;
                  document.getElementById("Color1").value = color1;
                  break;
              case 'Color 2':
                  color2 = message.value;
                  document.getElementById("Color2").value = color2;
                  break; 
              case 'Color 3':
                  color3 = message.value;
                  document.getElementById("Color3").value = color3;
                  break; 
              case 'Color 4':
                  color4 = message.value;
                  document.getElementById("Color4").value = color4;
                  break; 
              case 'FPS':
                  fps = message.value;
                  document.getElementById("fps").value = fps;
                  break;
              case 'Fade Amount':
                  fadeAmount = message.value;
                  document.getElementById("fadeAmount").value = fadeAmount;
                  break;
              case 'Brightness':
                  brightness = message.value;
                  document.getElementById("brightness").value = brightness;
                  break;
              case 'FPS Variability':
                  fps_variability = message.value;
                  document.getElementById("fps_variability").value = fps_variability;
                  break;
              case 'Twinkle Speed':
                  twinkleSpeed = message.value;
                  document.getElementById("twinkleSpeed").value = twinkleSpeed;
                  break;
              case 'Twinkle Density':
                  twinkleDensity = message.value;
                  document.getElementById("twinkleDensity").value = twinkleDensity;
                  break;
              case 'Cool Like':
                  coolLikeState = message.value;
                  if (coolLikeState == 1) {
                    document.getElementById("coolLikeState").checked = true;
                  } else {
                    document.getElementById("coolLikeState").checked = false;
                  }
                  break;
              case 'Auto Bg':
                  autoBgState = message.value;
                  if (autoBgState == 1) {
                    document.getElementById("autoBgState").checked = true;
                  } else {
                    document.getElementById("autoBgState").checked = false;
                  }
                  break;
          }
        };
    }


    // Function to unpack the group string into an array of LED indices
    function unpackGroup(input) {
        const ranges = input.split(","); // Split by commas
        let unpacked = [];

        ranges.forEach(range => {
            range = range.trim(); // Remove whitespace
            if (range.includes("-")) {
                // Handle range (e.g., "0-50")
                const [start, end] = range.split("-").map(Number);
                for (let i = start; i <= end; i++) {
                    unpacked.push(i);
                }
            } else {
                // Handle single LED (e.g., "55")
                unpacked.push(Number(range));
            }
        });

        return unpacked;
    }

    // Function to send the group to the ESP32
    function sendGroup() {
        const input = document.getElementById("groupInput").value;
        const unpackedGroup = unpackGroup(input);

        sendMessage("Group", unpackedGroup);
        console.log("Sent group:", unpackedGroup);
    }

    function sendMessage(type, value) {
        var message = JSON.stringify({type: type, value: value});
        socket.send(message);
    }

    window.onload = initWebSocket;

    function sendMode() {
      var mode = document.getElementById("mode").value;
      sendMessage("Mode", mode);
    }

    function sendRange() {
      var startRange = document.getElementById("startRange").value;
      var endRange = document.getElementById("endRange").value;
      sendMessage("Start Range", startRange);
      // delay to ensure startRange is sent first
        setTimeout(function() {
            sendMessage("End Range", endRange);
        }, 100);
    }
    
    function sendIncgHueState() {
      var incgHueState = document.getElementById("incgHueState").checked;
      sendMessage("Increment gHue", incgHueState);
    }

    function sendAudioBrightnessState() {
        var audioBrightness = document.getElementById("audioBrightness").checked;
        sendMessage("Brightness Audio", audioBrightness);
    }
    
    function sendPalette() {
      var palette = document.getElementById("palette").value;
      sendMessage("Palette", palette);
    }

    function changeColor1(value) {
        sendMessage("Color 1", value);
    }

    function changeColor2(value) {
        sendMessage("Color 2", value);
    }

    function changeColor3(value) {
        sendMessage("Color 3", value);
    }

    function changeColor4(value) {
        sendMessage("Color 4", value);
    }

    function changeFPS(value) {
        sendMessage("FPS", value);
    }

    function changeBrightness(value) {
        sendMessage("Brightness", value);
    }

    function changeFadeAmount(value) {
        sendMessage("Fade Amount", value);
    }

    function changeFPS_Variability(value) {
        sendMessage("FPS Variability", value);
    }

    function changeTwinkleSpeed(value) {
        sendMessage("Twinkle Speed", value);
    }

    function changeTwinkleDensity(value) {
        sendMessage("Twinkle Density", value);
    }
    
    function sendCoolLikeState() {
      var coolLikeState = document.getElementById("coolLikeState").checked;
      sendMessage("Cool Like", coolLikeState);
    }
    
    function sendAutoBgState() {
      var autoBgState = document.getElementById("autoBgState").checked;
      sendMessage("Auto Bg", autoBgState);
    }
  </script>
</body>

</html>
